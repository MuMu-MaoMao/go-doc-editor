<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go 本地文档编辑器 — 黑白 · 极简</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="padding: 20px;">
<div style="max-width: 1200px; margin: 0 auto;">
    <div style="background: white; border-radius: 32px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.12); overflow: hidden;">
        <!-- Hero 黑灰渐变 -->
        <div style="background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); color: white; padding: 64px 48px; text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 16px;">⚫⚪</div>
            <h1 style="font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; margin: 0 0 12px;">本地文档编辑器</h1>
            <p style="font-size: 1.1rem; opacity: 0.85; max-width: 500px; margin: 0 auto;">黑白之间 · 专注写作</p>
            <p style="font-size: 0.85rem; opacity: 0.7; margin-top: 12px;">纯 Go 后端 · JWT 认证 · 本地存储</p>
        </div>

        <div style="padding: 48px;">
            <h2 style="text-align: center; font-size: 1.5rem; font-weight: 500; letter-spacing: -0.3px;">纯粹 · 安全 · 零打扰</h2>
            <p style="text-align: center; color: #555; margin-bottom: 48px;">没有多余的色彩，只有黑与白的专注</p>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px;">
                <div style="background: #fafafa; border-radius: 24px; padding: 24px; border: 1px solid #eee;">
                    <div style="font-size: 2rem; margin-bottom: 12px;">🖤</div>
                    <h3 style="font-weight: 600;">极致轻量</h3>
                    <p style="color: #555; font-size: 0.85rem;">单一二进制，无需数据库，开箱即用。</p>
                </div>
                <div style="background: #fafafa; border-radius: 24px; padding: 24px; border: 1px solid #eee;">
                    <div style="font-size: 2rem; margin-bottom: 12px;">🔒</div>
                    <h3 style="font-weight: 600;">本地加密</h3>
                    <p style="color: #555; font-size: 0.85rem;">bcrypt + JWT，你的文档只属于你。</p>
                </div>
                <div style="background: #fafafa; border-radius: 24px; padding: 24px; border: 1px solid #eee;">
                    <div style="font-size: 2rem; margin-bottom: 12px;">📁</div>
                    <h3 style="font-weight: 600;">纯文本存储</h3>
                    <p style="color: #555; font-size: 0.85rem;">文件保存在 <code style="background:#eaeaea;padding:2px 6px;border-radius:12px;">C:\doxreader</code></p>
                </div>
            </div>

            <div style="text-align: center; margin-top: 56px;" id="authSection">
                <p style="color: #555; margin-bottom: 24px;">开始你的黑白写作之旅</p>
                <div class="cta-buttons" style="display: flex; gap: 16px; justify-content: center;">
                    <a href="/login.html" style="background: #1a1a1a; color: white; padding: 12px 40px; border-radius: 40px; text-decoration: none; font-weight: 500;">登录</a>
                    <a href="/register.html" style="background: white; color: #1a1a1a; padding: 12px 40px; border-radius: 40px; text-decoration: none; border: 1px solid #ccc;">注册</a>
                </div>
                <div class="logged-in-area" id="loggedInArea" style="display: none; margin-top: 24px;">
                    <p style="color: #333;">👋 欢迎回来</p>
                    <a href="/editor.html" style="display: inline-block; background: #1a1a1a; color: white; padding: 12px 40px; border-radius: 40px; text-decoration: none;">进入编辑器 →</a>
                    <button class="logout-link" id="logoutBtn" style="display: block; margin: 12px auto 0; background: none; border: none; color: #888; cursor: pointer;">退出登录</button>
                </div>
            </div>
        </div>

        <div style="text-align: center; padding: 24px; border-top: 1px solid #eee; font-size: 0.8rem; color: #888;">
            Go 本地文档编辑器 · 极简黑白版
        </div>
    </div>
</div>

<script type="module">
    import { getToken, removeToken, isLoggedIn } from '/static/auth.js';
    if (isLoggedIn()) {
        document.querySelector('.cta-buttons').style.display = 'none';
        document.getElementById('loggedInArea').style.display = 'block';
    }
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        removeToken();
        window.location.reload();
    });
</script>
</body>
</html>
