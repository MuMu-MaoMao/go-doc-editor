<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - Go 文档编辑器</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 80px auto;
            padding: 36px 32px;
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: white;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }
        .profile-info h2 {
            font-size: 1.4rem;
            margin: 0 0 4px;
            font-weight: 600;
        }
        .profile-info .meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .profile-section {
            margin-bottom: 24px;
        }
        .profile-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 0 0 12px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .info-row .label {
            color: var(--text-secondary);
        }
        .info-row .value {
            font-weight: 500;
        }
        .login-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .login-list li {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }
        .login-list li:last-child {
            border-bottom: none;
        }
        .login-list .login-index {
            color: var(--text-muted);
            min-width: 30px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: all 0.2s;
        }
        .back-link:hover {
            background: var(--bg-hover);
            border-color: var(--border-dark);
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }
        .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="app" style="flex-direction:column; min-height:auto;">
        <header>
            <h1>本地文档<code>编辑器</code></h1>
            <p><code>个人主页</code></p>
        </header>
        <div id="profileApp">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script type="module" src="/static/auth.js"></script>
    <script type="module" src="/static/profile.js"></script>
</body>
</html>
