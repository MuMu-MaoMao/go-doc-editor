<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 文档编辑器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-container">
    <h2>注册</h2>
    <div id="errorMsg" class="error"></div>
    <input type="text" id="username" placeholder="用户名" autocomplete="username">
    <input type="password" id="password" placeholder="密码" autocomplete="new-password">
    <button id="registerBtn">注册</button>
    <div class="link">已有账号？ <a href="/login.html">去登录</a></div>
    <div class="link"><a href="/">返回首页</a></div>
</div>
<script type="module">
    const registerBtn = document.getElementById('registerBtn');
    const errorDiv = document.getElementById('errorMsg');
    registerBtn.addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) {
            errorDiv.textContent = '请填写完整信息';
            return;
        }
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                alert('注册成功，请登录');
                window.location.href = '/login.html';
            } else {
                errorDiv.textContent = data.error || '注册失败';
            }
        } catch (err) {
            errorDiv.textContent = '网络错误';
        }
    });
</script>
</body>
</html>
